name: Notify Repo Events

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner label (e.g. ubuntu-latest or self-hosted)
        type: string
        required: false
        default: ubuntu-latest
    secrets:
      TELEGRAM_TO:
        required: true
      TELEGRAM_TOKEN:
        required: true

# Grant only the permissions required to read the repository.
permissions:
  contents: read

jobs:
  notify:
    name: telegram notify
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5

    steps:
      - name: Checkout notification script
        uses: actions/checkout@v4
        with:
          repository: kioteam-ir/kio-github-actions
          ref: v1
          persist-credentials: false

      - name: Build notification message
        id: build
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          WORKSPACE: ${{ github.workspace }}
        run: python3 .github/scripts/notify_telegram.py

      - name: Send Telegram message
        if: steps.build.outputs.send == 'true'
        # مستقیم صدا زده می‌شود چون wrapper همین مخزن هنوز message_file را رد نمی‌کند —
        # همان SHA‌ای که خودش پین کرده (v1.1.1).
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_TO }}
          message_file: tg-message.html
          format: html
          message_thread_id: "8643"
          disable_web_page_preview: true
          disable_notification: ${{ github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment' }}
